name: CI

on:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:

env:
  GO111MODULE: "off"
  GO15VENDOREXPERIMENT: "1"
  GO_VERSION: "1.13"
  GOPATH: ${{ github.workspace }}/go

jobs:
  unit:
    name: Unit (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go/src/github.com/involucro/involucro
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            filename: involucro
          - name: macos
            os: macos-latest
            filename: involucro.darwin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: go/src/github.com/involucro/involucro
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Test and build
        env:
          MODE: unit
          FILENAME: ${{ matrix.filename }}
        run: ./ci/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: go/src/github.com/involucro/involucro/${{ matrix.filename }}
          if-no-files-found: error

  integration:
    name: Integration (${{ matrix.name }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/src/github.com/involucro/involucro
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: docker-latest
            source: get.docker.com
            publish: true
          - name: docker-hosted
            source: ""
            publish: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: go/src/github.com/involucro/involucro
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install Docker from ${{ matrix.source }}
        if: ${{ matrix.source != '' }}
        run: curl -fsSL "https://${{ matrix.source }}/" | sudo sh
      - name: Test, build, and wrap
        env:
          MODE: integration
          FILENAME: involucro
        run: ./ci/build.sh
      - name: Configure Docker Hub credentials
        if: ${{ matrix.publish && github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          if [ -z "$HUB_TOKEN" ]; then
            echo "HUB_TOKEN is required to publish involucro/tool to Docker Hub." >&2
            exit 1
          fi
          printf '{"auths": ["%s"]}\n' "$HUB_TOKEN" > ~/.involucro
      - name: Publish Docker image
        if: ${{ matrix.publish && github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
        run: ./involucro upload-to-hub

  cross-build:
    name: Cross-build (${{ matrix.name }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/src/github.com/involucro/involucro
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            mode: windows-build
            artifacts: |
              involucro.exe
              involucro32.exe
          - name: linux-arm64
            mode: cross-arm64
            filename: involucro.linux-arm64
            artifacts: involucro.linux-arm64
          - name: linux-arm32
            mode: cross-arm
            filename: involucro.linux-arm32
            artifacts: involucro.linux-arm32
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: go/src/github.com/involucro/involucro
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build
        env:
          MODE: ${{ matrix.mode }}
          FILENAME: ${{ matrix.filename }}
        run: ./ci/build.sh
      - name: Collect artifacts
        env:
          ARTIFACTS: ${{ matrix.artifacts }}
        run: |
          mkdir -p ci-artifacts
          while IFS= read -r artifact; do
            [ -z "$artifact" ] && continue
            cp "$artifact" ci-artifacts/
          done <<EOF
          $ARTIFACTS
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: go/src/github.com/involucro/involucro/ci-artifacts/*
          if-no-files-found: error

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs:
      - unit
      - integration
      - cross-build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: go/src/github.com/involucro/involucro
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          find dist -type f -maxdepth 2 -print
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*/* --clobber
          else
            gh release create "$TAG" dist/*/* --title "$TAG" --notes "Release $TAG"
          fi
