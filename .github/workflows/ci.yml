name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

env:
  GOFLAGS: -mod=readonly

jobs:
  unit:
    name: Unit (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            filename: involucro
          - name: macos
            os: macos-latest
            filename: involucro.darwin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test and build
        env:
          MODE: unit
          FILENAME: ${{ matrix.filename }}
        run: ./ci/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: ${{ matrix.filename }}
          if-no-files-found: error

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Docker diagnostics
        run: |
          docker version
          docker info
      - name: Test, build, and wrap
        env:
          MODE: integration
          FILENAME: involucro
        run: ./ci/build.sh
      - uses: docker/setup-buildx-action@v3
        if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
      - uses: docker/login-action@v3
        if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish Docker image
        if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        env:
          IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
        run: |
          mkdir -p docker-context/amd64 docker-context/arm64 docker-context/armv7
          cp involucro docker-context/amd64/involucro

          # ARM images use cross-compiled static binaries; integration tests run on linux/amd64.
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o docker-context/arm64/involucro -ldflags "-s -w -X github.com/involucro/involucro/app.version=$(git describe --tags --always)" ./cmd/involucro
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -o docker-context/armv7/involucro -ldflags "-s -w -X github.com/involucro/involucro/app.version=$(git describe --tags --always)" ./cmd/involucro

          docker buildx build \
            --platform linux/amd64,linux/arm64,linux/arm/v7 \
            --tag "involucro/tool:${IMAGE_TAG}" \
            --push \
            --file ci/Dockerfile \
            .

  windows:
    name: Windows amd64
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build version resources
        run: |
          New-Item -ItemType Directory -Force .bin | Out-Null
          $env:GOFLAGS = ""
          $env:GOBIN = "$(Get-Location)\.bin"
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
          & ".\.bin\goversioninfo.exe" "-product-version=$(git describe --tags --always)"
      - name: Build
        run: |
          go build -o involucro.exe -ldflags "-s -w -X github.com/involucro/involucro/app.version=$(git describe --tags --always)" ./cmd/involucro
          ./involucro.exe --version
      - name: Test
        run: go test ./internal/... ./auth -v

  cross-build:
    name: Cross-build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            mode: windows-amd64
            artifacts: involucro.exe
          - name: linux-amd64
            mode: linux-amd64
            filename: involucro.linux-amd64
            artifacts: involucro.linux-amd64
          - name: linux-arm64
            mode: linux-arm64
            filename: involucro.linux-arm64
            artifacts: involucro.linux-arm64
          - name: linux-arm-v7
            mode: linux-arm-v7
            filename: involucro.linux-armv7
            artifacts: involucro.linux-armv7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          MODE: ${{ matrix.mode }}
          FILENAME: ${{ matrix.filename }}
        run: ./ci/build.sh
      - name: Collect artifacts
        env:
          ARTIFACTS: ${{ matrix.artifacts }}
        run: |
          mkdir -p ci-artifacts
          while IFS= read -r artifact; do
            [ -z "$artifact" ] && continue
            cp "$artifact" ci-artifacts/
          done <<EOF
          $ARTIFACTS
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ci-artifacts/*
          if-no-files-found: error

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs:
      - unit
      - integration
      - windows
      - cross-build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          find dist -type f -maxdepth 2 -print
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*/* --clobber
          else
            gh release create "$TAG" dist/*/* --title "$TAG" --notes "Release $TAG"
          fi
